on:
  pull_request

jobs:
  code-standards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - name: Code Standards Test
        uses: docker://ghcr.io/aligent/code-standards-pipe-php:8.2
        env:
          STANDARDS: "Magento2"
          SKIP_DEPENDENCIES: "true"

